<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroHarvest - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f4fbf5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px 14px; }
        .card { width: 100%; max-width: 390px; background: #ffffff; border-radius: 28px; padding: 32px 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); text-align: center; }
        .logo-box { width: 68px; height: 68px; background: #dcfce7; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 32px; color: #16a34a; }
        h2 { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
        p.sub { font-size: 13px; color: #64748b; margin-bottom: 24px; }
        .form-group { position: relative; margin-bottom: 14px; text-align: left; }
        .form-group i { position: absolute; left: 16px; top: 16px; color: #94a3b8; font-size: 16px; }
        .form-input { width: 100%; padding: 14px 14px 14px 44px; border: 1.5px solid #e2e8f0; border-radius: 14px; font-size: 14px; font-weight: 600; color: #0f172a; outline: none; background: #f8fafc; }
        .form-input:focus { border-color: #16a34a; background: #ffffff; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #16a34a, #15803d); color: white; border: none; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 10px; box-shadow: 0 6px 18px rgba(22, 163, 74, 0.3); }
        .footer-link { margin-top: 20px; font-size: 13px; color: #64748b; font-weight: 600; }
        .footer-link a { color: #16a34a; text-decoration: none; font-weight: 800; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-box"><i class="fa-solid fa-seedling"></i></div>
        <h2>Welcome Back</h2>
        <p class="sub">Login to your AgroHarvest Account</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <i class="fa-solid fa-mobile-screen"></i>
                <input type="tel" id="loginPhone" class="form-input" placeholder="10 Digit Mobile Number" maxlength="10" required>
            </div>
            <div class="form-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="loginPassword" class="form-input" placeholder="Password" required>
            </div>
            <button type="submit" id="loginBtn" class="btn-submit">Login</button>
        </form>

        <div class="footer-link">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>

    <script>
        requireGuest();

        async function handleLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerText = "Verifying...";

            try {
                const { data: user, error } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('phone', phone)
                    .eq('password', password)
                    .maybeSingle();

                if (error || !user) {
                    alert("Mobile number ya password galat hai!");
                    btn.disabled = false;
                    btn.innerText = "Login";
                    return;
                }

                setSessionUser(user);
                window.location.replace("index.html");

            } catch (err) {
                alert("Login failed: " + err.message);
                btn.disabled = false;
                btn.innerText = "Login";
            }
        }
    </script>
</body>
</html>

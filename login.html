<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroHarvest - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0f172a; display: flex; justify-content: center; min-height: 100vh; }
        
        .mobile-container { width: 100%; max-width: 430px; background: #ffffff; min-height: 100vh; position: relative; display: flex; flex-direction: column; }

        .hero-header { height: 260px; width: 100%; position: relative; background: #166534; overflow: hidden; }
        .hero-header img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.45) 100%); display: flex; justify-content: space-between; align-items: flex-start; padding: 20px 18px; }
        
        .lang-badge { background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 800; color: #0f172a; display: flex; align-items: center; gap: 6px; }
        .brand-pill { background: rgba(22, 163, 74, 0.95); backdrop-filter: blur(8px); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 800; color: white; display: flex; align-items: center; gap: 6px; }

        .form-sheet { flex: 1; background: #ffffff; margin-top: -36px; border-radius: 36px 36px 0 0; padding: 32px 24px 20px; position: relative; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 -10px 30px rgba(0,0,0,0.12); }
        
        .title-box { margin-bottom: 24px; }
        .title-box h1 { font-size: 26px; font-weight: 900; color: #0f172a; letter-spacing: -0.5px; }
        .title-box p { font-size: 13px; color: #64748b; font-weight: 600; margin-top: 4px; }

        .input-wrap { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 18px; padding: 6px 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; height: 58px; transition: all 0.2s; }
        .input-wrap:focus-within { border-color: #16a34a; background: #ffffff; box-shadow: 0 4px 20px rgba(22, 163, 74, 0.12); }
        .input-icon-box { width: 36px; height: 36px; background: #dcfce7; color: #16a34a; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
        
        .prefix { font-weight: 800; color: #0f172a; font-size: 15px; border-right: 1.5px solid #cbd5e1; padding-right: 10px; }
        .input-wrap input { width: 100%; border: none; outline: none; background: transparent; font-size: 15px; font-weight: 700; color: #0f172a; }

        .terms-row { display: flex; align-items: center; gap: 8px; margin: 10px 4px 22px; font-size: 12px; font-weight: 600; color: #475569; }
        .terms-row input { width: 16px; height: 16px; accent-color: #16a34a; }
        .terms-row a { color: #16a34a; text-decoration: none; font-weight: 700; }

        .btn-login { width: 100%; background: linear-gradient(135deg, #15803d, #16a34a); color: #ffffff; border: none; padding: 16px; border-radius: 18px; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 8px 24px rgba(22, 163, 74, 0.35); }
        .btn-login:active { transform: scale(0.98); }

        .footer-text { text-align: center; margin-top: 24px; font-size: 13px; font-weight: 600; color: #64748b; }
        .footer-text a { color: #16a34a; font-weight: 800; text-decoration: none; margin-left: 4px; }
    </style>
</head>
<body>
    <div class="mobile-container">
        <div class="hero-header">
            <img src="https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=800&q=80" alt="AgroHarvest Smart Farming">
            <div class="hero-overlay">
                <div class="brand-pill"><i class="fa-solid fa-seedling"></i> AgroHarvest</div>
                <div class="lang-badge"><i class="fa-solid fa-globe"></i> ENG</div>
            </div>
        </div>

        <div class="form-sheet">
            <div>
                <div class="title-box">
                    <h1>Welcome Back</h1>
                    <p>Grow Smart, Harvest More</p>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="input-wrap">
                        <div class="input-icon-box"><i class="fa-solid fa-phone"></i></div>
                        <span class="prefix">+91</span>
                        <input type="tel" id="loginPhone" placeholder="Enter Phone Number" maxlength="10" required>
                    </div>

                    <div class="input-wrap">
                        <div class="input-icon-box"><i class="fa-solid fa-lock"></i></div>
                        <input type="password" id="loginPassword" placeholder="Enter your Password" required>
                        <i class="fa-regular fa-eye-slash" id="togglePass" onclick="togglePasswordVisibility()" style="color: #94a3b8; cursor: pointer;"></i>
                    </div>

                    <div class="terms-row">
                        <input type="checkbox" id="termsCheck" checked required>
                        <label for="termsCheck">By logging in you agree to the <a href="#">Terms & Conditions</a></label>
                    </div>

                    <button type="submit" id="loginBtn" class="btn-login">Login Now</button>
                </form>
            </div>

            <div class="footer-text">
                Don't have an account?<a href="register.html">Register</a>
            </div>
        </div>
    </div>

    <script>
        requireGuest();

        function togglePasswordVisibility() {
            const passField = document.getElementById('loginPassword');
            const icon = document.getElementById('togglePass');
            if (passField.type === "password") {
                passField.type = "text";
                icon.className = "fa-regular fa-eye";
            } else {
                passField.type = "password";
                icon.className = "fa-regular fa-eye-slash";
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const btn = document.getElementById('loginBtn');

            const sb = getSupabase();
            if (!sb) {
                alert("Database initializing... Dobara try karein.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Authenticating...";

            try {
                const { data: user, error } = await sb
                    .from('profiles')
                    .select('*')
                    .eq('phone', phone)
                    .eq('password', password)
                    .maybeSingle();

                if (error || !user) {
                    alert("Mobile number ya password galat hai!");
                    btn.disabled = false;
                    btn.innerText = "Login Now";
                    return;
                }

                setSessionUser(user);
                window.location.replace("index.html");

            } catch (err) {
                alert("Login failed: " + err.message);
                btn.disabled = false;
                btn.innerText = "Login Now";
            }
        }
    </script>
</body>
</html>

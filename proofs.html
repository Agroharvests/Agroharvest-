<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroHarvest - Live Withdrawal Proofs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0f172a; display: flex; justify-content: center; min-height: 100vh; color: #0f172a; }
        .app-container { width: 100%; max-width: 430px; background: #f8fafc; min-height: 100vh; padding-bottom: 80px; position: relative; box-shadow: 0 0 35px rgba(0,0,0,0.15); }

        /* Top Header */
        .top-header { background: #ffffff; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e2e8f0; font-weight: 800; font-size: 17px; position: sticky; top: 0; z-index: 50; }
        .live-pill { background: #fee2e2; color: #dc2626; font-size: 11px; font-weight: 900; padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 6px; }
        .live-dot { width: 7px; height: 7px; background: #dc2626; border-radius: 50%; animation: blink 1s infinite alternate; }
        @keyframes blink { 0% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Upload Card with Gallery Picker */
        .upload-card { background: white; margin: 16px; border-radius: 22px; padding: 18px; border: 1.5px solid #e2e8f0; box-shadow: 0 4px 18px rgba(0,0,0,0.03); }
        .upload-card h3 { font-size: 16px; font-weight: 900; color: #0f172a; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .upload-card p { font-size: 12px; color: #64748b; font-weight: 600; margin-bottom: 14px; }

        .input-row { margin-bottom: 12px; }
        .input-row label { font-size: 12px; font-weight: 800; color: #334155; display: block; margin-bottom: 4px; }
        .input-box { width: 100%; border: 1.5px solid #e2e8f0; padding: 12px 14px; border-radius: 14px; font-size: 14px; font-weight: 700; outline: none; transition: 0.2s; }
        .input-box:focus { border-color: #16a34a; background: #ffffff; }

        /* Photo Upload Dropzone */
        .photo-picker-box { border: 2px dashed #16a34a; background: #f0fdf4; border-radius: 16px; padding: 18px; text-align: center; cursor: pointer; position: relative; margin-bottom: 14px; transition: all 0.2s; }
        .photo-picker-box:active { transform: scale(0.98); }
        .photo-picker-box i { font-size: 28px; color: #16a34a; margin-bottom: 6px; }
        .photo-picker-box span { font-size: 13px; font-weight: 800; color: #15803d; display: block; }
        .photo-picker-box small { font-size: 11px; color: #64748b; font-weight: 600; }
        .preview-thumb { width: 100%; max-height: 180px; object-fit: cover; border-radius: 12px; display: none; margin-top: 10px; border: 1px solid #bbf7d0; }

        .btn-post { width: 100%; background: linear-gradient(135deg, #15803d, #16a34a); color: white; border: none; padding: 14px; border-radius: 16px; font-weight: 900; font-size: 15px; cursor: pointer; box-shadow: 0 6px 18px rgba(22, 163, 74, 0.3); }
        .btn-post:disabled { opacity: 0.6; }

        /* Community Feed Cards */
        .feed-header { padding: 0 20px 10px; display: flex; justify-content: space-between; align-items: center; }
        .feed-header h4 { font-size: 16px; font-weight: 900; color: #0f172a; }
        
        .feed-list { padding: 0 16px; display: flex; flex-direction: column; gap: 16px; }
        .proof-card { background: white; border: 1.5px solid #e2e8f0; border-radius: 22px; padding: 16px; box-shadow: 0 4px 18px rgba(0,0,0,0.03); }
        .user-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .user-left { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 38px; height: 38px; background: #dcfce7; color: #16a34a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; }
        .user-meta strong { font-size: 13px; font-weight: 900; color: #0f172a; display: block; }
        .user-meta span { font-size: 11px; color: #64748b; font-weight: 600; }

        .received-badge { background: #dcfce7; color: #15803d; font-size: 12px; font-weight: 900; padding: 5px 12px; border-radius: 20px; display: flex; align-items: center; gap: 5px; border: 1px solid #86efac; }
        
        .proof-image-wrap { width: 100%; border-radius: 16px; overflow: hidden; margin: 10px 0; border: 1px solid #e2e8f0; background: #0f172a; }
        .proof-img { width: 100%; max-height: 380px; object-fit: contain; display: block; background: #f8fafc; }
        
        .proof-caption { font-size: 13px; font-weight: 700; color: #334155; margin-top: 8px; line-height: 1.4; }
        .social-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px solid #f1f5f9; font-size: 12px; color: #64748b; font-weight: 700; }
        .like-btn { background: #f8fafc; border: 1px solid #e2e8f0; padding: 6px 12px; border-radius: 20px; cursor: pointer; color: #dc2626; display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 12px; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Top Nav -->
        <div class="top-header">
            <a href="index.html" style="color: #0f172a; text-decoration: none;"><i class="fa-solid fa-arrow-left"></i></a>
            <span>Community Proofs</span>
            <div class="live-pill"><span class="live-dot"></span> LIVE</div>
        </div>

        <!-- Gallery Upload Form -->
        <div class="upload-card">
            <h3><i class="fa-solid fa-cloud-arrow-up" style="color: #16a34a;"></i> Post Withdrawal Proof</h3>
            <p>Screenshot upload karein taaki sabhi members dekh sakein.</p>

            <div class="input-row">
                <label>Withdrawal Amount Received (₹)</label>
                <input type="number" id="proofAmount" class="input-box" placeholder="e.g. 1500" required>
            </div>

            <!-- Direct File / Gallery Picker -->
            <div class="photo-picker-box" onclick="document.getElementById('proofFileInput').click()">
                <i class="fa-solid fa-camera"></i>
                <span id="pickerLabel">Tap to Select Screenshot from Gallery</span>
                <small>PNG, JPG, JPEG supported</small>
                <input type="file" id="proofFileInput" accept="image/*" style="display: none;" onchange="handleFileSelected(event)">
                <img id="previewImg" class="preview-thumb" alt="Preview">
            </div>

            <div class="input-row">
                <label>Message / Caption (Optional)</label>
                <input type="text" id="proofCaption" class="input-box" placeholder="e.g. Received my withdrawal in 10 mins! Thank you AgroHarvest.">
            </div>

            <button onclick="publishProof()" id="postBtn" class="btn-post">Post Screenshot Proof</button>
        </div>

        <div class="feed-header">
            <h4>Recent Member Payouts</h4>
            <span id="totalProofsCount" style="font-size: 12px; font-weight: 800; color: #16a34a;">0 Proofs</span>
        </div>

        <!-- Live Feed Container -->
        <div class="feed-list" id="feedContainer">
            <div style="text-align: center; padding: 40px 20px; color: #94a3b8; font-weight: 700;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; color: #16a34a; margin-bottom: 10px;"></i>
                <p>Loading member withdrawal proofs...</p>
            </div>
        </div>
    </div>
        <script>
        const activeUser = requireAuth();
        let selectedBase64Image = null;

        document.addEventListener("DOMContentLoaded", loadProofsFeed);

        // Compress and convert gallery photo to base64
        function handleFileSelected(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    // Max width 800px for optimal speed
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    selectedBase64Image = canvas.toDataURL('image/jpeg', 0.82);
                    
                    const preview = document.getElementById('previewImg');
                    preview.src = selectedBase64Image;
                    preview.style.display = 'block';
                    document.getElementById('pickerLabel').innerText = "✅ Screenshot Selected (Tap to change)";
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function publishProof() {
            const amount = parseFloat(document.getElementById('proofAmount').value);
            const caption = document.getElementById('proofCaption').value.trim();
            const btn = document.getElementById('postBtn');

            if (!amount || isNaN(amount) || amount <= 0) {
                return alert("Kripya sahi withdrawal amount enter karein!");
            }
            if (!selectedBase64Image) {
                return alert("Kripya gallery se payment screenshot select karein!");
            }

            const sb = getSupabase();
            if (!sb) return alert("Connecting database...");

            btn.disabled = true;
            btn.innerText = "Uploading Proof...";

            try {
                const { error } = await sb.from('payment_proofs').insert([{
                    user_id: activeUser.id,
                    user_phone: activeUser.phone,
                    proof_type: 'withdrawal',
                    amount: amount,
                    image_url: selectedBase64Image,
                    caption: caption || 'Received my withdrawal on time! ✅'
                }]);

                if (error) throw error;

                alert("🎉 Screenshot Proof Successfully Post ho gaya!");
                document.getElementById('proofAmount').value = '';
                document.getElementById('proofCaption').value = '';
                document.getElementById('previewImg').style.display = 'none';
                document.getElementById('pickerLabel').innerText = "Tap to Select Screenshot from Gallery";
                selectedBase64Image = null;

                loadProofsFeed();

            } catch (err) {
                alert("Upload failed: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Post Screenshot Proof";
            }
        }

        async function loadProofsFeed() {
            const sb = getSupabase();
            if (!sb) return;

            const { data: proofs, error } = await sb
                .from('payment_proofs')
                .select('*')
                .order('created_at', { ascending: false });

            const feed = document.getElementById('feedContainer');
            if (error || !proofs || proofs.length === 0) {
                feed.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; color: #94a3b8; font-weight: 700;">
                        <i class="fa-solid fa-receipt" style="font-size: 36px; color: #cbd5e1; margin-bottom: 10px;"></i>
                        <p>Sabse pehla withdrawal screenshot aap post karein!</p>
                    </div>
                `;
                document.getElementById('totalProofsCount').innerText = "0 Proofs";
                return;
            }

            document.getElementById('totalProofsCount').innerText = `${proofs.length} Proofs`;

            feed.innerHTML = proofs.map(p => {
                const phoneStr = p.user_phone || "9999999999";
                const maskedPhone = `+91 ${phoneStr.substring(0, 3)}****${phoneStr.substring(7)}`;
                const timeAgo = formatTimeAgo(p.created_at);

                return `
                    <div class="proof-card">
                        <div class="user-row">
                            <div class="user-left">
                                <div class="user-avatar"><i class="fa-solid fa-user-check"></i></div>
                                <div class="user-meta">
                                    <strong>${maskedPhone}</strong>
                                    <span>${timeAgo}</span>
                                </div>
                            </div>
                            <div class="received-badge">
                                <i class="fa-solid fa-circle-check"></i> ₹${parseFloat(p.amount).toFixed(2)} Received
                            </div>
                        </div>

                        <div class="proof-image-wrap">
                            <img src="${p.image_url}" class="proof-img" alt="Payment Proof" loading="lazy" onclick="window.open(this.src, '_blank')">
                        </div>

                        <div class="proof-caption">"${p.caption || 'Verified Withdrawal Payout'}"</div>

                        <div class="social-bar">
                            <button class="like-btn" onclick="toggleLike(this)"><i class="fa-solid fa-heart"></i> Verified</button>
                            <span style="color: #16a34a; font-weight: 800;"><i class="fa-solid fa-shield-halved"></i> 100% Genuine</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function formatTimeAgo(dateString) {
            if (!dateString) return "Recently";
            const date = new Date(dateString);
            const now = new Date();
            const diffSeconds = Math.floor((now - date) / 1000);

            if (diffSeconds < 60) return "Just now";
            const diffMinutes = Math.floor(diffSeconds / 60);
            if (diffMinutes < 60) return `${diffMinutes} mins ago`;
            const diffHours = Math.floor(diffMinutes / 60);
            if (diffHours < 24) return `${diffHours} hours ago`;
            const diffDays = Math.floor(diffHours / 24);
            return `${diffDays} days ago`;
        }

        function toggleLike(btn) {
            btn.innerHTML = `<i class="fa-solid fa-heart" style="color: #dc2626;"></i> Liked!`;
        }
    </script>
</body>
</html>

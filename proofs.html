<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroHarvest - Community Proofs Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0b1329; display: flex; justify-content: center; min-height: 100vh; color: #0f172a; }
        .app-container { width: 100%; max-width: 430px; background: #f8fafc; min-height: 100vh; padding-bottom: 95px; position: relative; box-shadow: 0 0 35px rgba(0,0,0,0.25); }

        .top-header { background: #ffffff; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e2e8f0; font-weight: 800; font-size: 17px; position: sticky; top: 0; z-index: 50; }
        .badge-live { font-size: 11px; background: #fee2e2; color: #dc2626; padding: 4px 10px; border-radius: 20px; font-weight: 900; display: flex; align-items: center; gap: 5px; }
        .pulse-dot { width: 7px; height: 7px; background: #dc2626; border-radius: 50%; display: inline-block; }

        /* Upload Card */
        .upload-card { background: white; margin: 14px 16px; border-radius: 24px; padding: 18px; border: 1.5px solid #e2e8f0; box-shadow: 0 6px 20px rgba(0,0,0,0.03); }
        .type-selector-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
        .type-pill { background: #f8fafc; border: 1.5px solid #e2e8f0; padding: 9px 8px; border-radius: 12px; font-size: 11px; font-weight: 800; color: #475569; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: all 0.2s; }
        .type-pill.active { background: #dcfce7; border-color: #16a34a; color: #15803d; box-shadow: 0 2px 8px rgba(22, 163, 74, 0.15); }

        .drop-zone { border: 2px dashed #16a34a; background: #f0fdf4; border-radius: 18px; padding: 18px 12px; text-align: center; cursor: pointer; margin-bottom: 12px; transition: all 0.2s; }
        .drop-zone:active { transform: scale(0.98); }
        .preview-img { width: 100%; max-height: 220px; object-fit: contain; border-radius: 14px; margin-top: 10px; display: none; border: 1px solid #cbd5e1; }

        .input-row { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; margin-bottom: 12px; }
        .input-field { width: 100%; border: 1.5px solid #e2e8f0; padding: 11px 12px; border-radius: 12px; font-size: 13px; font-weight: 700; outline: none; color: #0f172a; }
        .input-field:focus { border-color: #16a34a; }

        .btn-post { width: 100%; background: linear-gradient(135deg, #15803d, #16a34a); color: white; border: none; padding: 13px; border-radius: 14px; font-weight: 900; font-size: 14px; cursor: pointer; box-shadow: 0 4px 14px rgba(22, 163, 74, 0.3); }

        /* Feed Category Filter */
        .filter-scroller { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 14px; scrollbar-width: none; }
        .filter-scroller::-webkit-scrollbar { display: none; }
        .filter-chip { background: white; border: 1.5px solid #e2e8f0; padding: 7px 14px; border-radius: 20px; font-size: 11px; font-weight: 800; color: #64748b; white-space: nowrap; cursor: pointer; }
        .filter-chip.active { background: #0f172a; color: white; border-color: #0f172a; }

        /* Proof Item Cards */
        .feed-container { padding: 0 16px; display: flex; flex-direction: column; gap: 16px; }
        .proof-post { background: white; border-radius: 22px; border: 1.5px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.03); }
        .post-header { padding: 14px 16px 10px; display: flex; justify-content: space-between; align-items: center; }
        .user-block { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 38px; height: 38px; background: #dcfce7; color: #16a34a; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .badge-type { font-size: 10px; font-weight: 900; padding: 4px 8px; border-radius: 8px; text-transform: uppercase; }
        .type-bank { background: #dcfce7; color: #15803d; }
        .type-referral { background: #f3e8ff; color: #7e22ce; }
        .type-withdrawal { background: #dbeafe; color: #1d4ed8; }
        .type-yield { background: #fef3c7; color: #b45309; }

        .proof-image-box { width: 100%; background: #0f172a; max-height: 420px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .proof-image-box img { width: 100%; max-height: 420px; object-fit: contain; }

        .post-footer { padding: 12px 16px 14px; }
        .post-caption { font-size: 13px; font-weight: 700; color: #1e293b; margin-bottom: 10px; line-height: 1.4; }
        .post-actions { display: flex; justify-content: space-between; align-items: center; }
        .like-btn { background: #f8fafc; border: 1px solid #e2e8f0; padding: 6px 12px; border-radius: 10px; font-size: 12px; font-weight: 800; color: #dc2626; cursor: pointer; display: flex; align-items: center; gap: 5px; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 430px; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; align-items: center; padding: 10px 0 8px; z-index: 100; }
        .nav-item { text-align: center; text-decoration: none; color: #64748b; font-size: 11px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: #16a34a; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <a href="index.html" style="color: #0f172a; text-decoration: none;"><i class="fa-solid fa-arrow-left"></i></a>
                <span>Community Proofs</span>
            </div>
            <span class="badge-live"><span class="pulse-dot"></span> LIVE FEED</span>
        </div>

        <!-- Multi-Category Upload Box -->
        <div class="upload-card">
            <p style="font-size: 12px; font-weight: 800; color: #64748b; margin-bottom: 8px;">1. Select Proof Category:</p>
            <div class="type-selector-grid">
                <div class="type-pill active" onclick="selectProofType('bank', this)">
                    <i class="fa-solid fa-building-columns"></i> Bank SMS / Credit
                </div>
                <div class="type-pill" onclick="selectProofType('referral', this)">
                    <i class="fa-solid fa-users"></i> Referral Income
                </div>
                <div class="type-pill" onclick="selectProofType('withdrawal', this)">
                    <i class="fa-solid fa-wallet"></i> Payout Record
                </div>
                <div class="type-pill" onclick="selectProofType('yield', this)">
                    <i class="fa-solid fa-seedling"></i> Daily Harvest
                </div>
            </div>

            <div class="drop-zone" onclick="document.getElementById('proofFileInput').click()">
                <i class="fa-solid fa-camera" style="font-size: 24px; color: #16a34a; margin-bottom: 4px;"></i>
                <p id="dropText" style="font-size: 13px; font-weight: 800; color: #15803d;">Tap to Upload Screenshot</p>
                <img id="imagePreview" class="preview-img" alt="Preview">
            </div>
            <input type="file" id="proofFileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">

            <div class="input-row">
                <input type="number" id="proofAmtInput" class="input-field" placeholder="Amount ₹ (e.g. 500)">
                <input type="text" id="proofCaptionInput" class="input-field" placeholder="Message (e.g. Received in 5 mins!)">
            </div>

            <button onclick="uploadPaymentProof()" id="postBtn" class="btn-post">
                <i class="fa-solid fa-paper-plane"></i> Share Proof with Community
            </button>
        </div>

        <!-- Filter Chips -->
        <div class="filter-scroller">
            <div class="filter-chip active" onclick="filterProofs('all', this)">🔥 All Proofs</div>
            <div class="filter-chip" onclick="filterProofs('bank', this)">🏦 Bank SMS</div>
            <div class="filter-chip" onclick="filterProofs('referral', this)">👥 Referral Rewards</div>
            <div class="filter-chip" onclick="filterProofs('withdrawal', this)">💳 Payouts</div>
            <div class="filter-chip" onclick="filterProofs('yield', this)">🌱 Harvest Yield</div>
        </div>

        <!-- Live Proofs Stream -->
        <div class="feed-container" id="proofsFeed">
            <p style="text-align: center; color: #94a3b8; font-weight: 700; padding: 20px;">Loading live proofs...</p>
    </div>
            <div class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="orders.html" class="nav-item"><i class="fa-solid fa-seedling"></i><span>Seeds</span></a>
            <a href="team.html" class="nav-item"><i class="fa-solid fa-users"></i><span>Team</span></a>
            <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Profile</span></a>
        </div>
    </div>

    <script>
        const activeUser = requireAuth();
        let selectedProofType = 'bank';
        let base64Image = null;
        let allProofsData = [];
        let currentFilter = 'all';

        document.addEventListener("DOMContentLoaded", loadProofsFeed);

        function selectProofType(type, el) {
            selectedProofType = type;
            document.querySelectorAll('.type-pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Compress image to fast lightweight base64
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 800;

                    if (width > height && width > maxDim) {
                        height *= maxDim / width;
                        width = maxDim;
                    } else if (height > maxDim) {
                        width *= maxDim / height;
                        height = maxDim;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    base64Image = canvas.toDataURL('image/jpeg', 0.7);

                    const prev = document.getElementById('imagePreview');
                    prev.src = base64Image;
                    prev.style.display = 'block';
                    document.getElementById('dropText').innerText = "Screenshot Selected (Tap to Change)";
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function uploadPaymentProof() {
            if (!base64Image) return alert("Kripya pehle screenshot select karein!");

            const amt = parseFloat(document.getElementById('proofAmtInput').value) || 0;
            const caption = document.getElementById('proofCaptionInput').value.trim();
            const btn = document.getElementById('postBtn');

            const sb = getSupabase();
            if (!sb) return alert("Database connection error.");

            btn.disabled = true;
            btn.innerText = "Publishing Proof...";

            try {
                const { error } = await sb.from('payment_proofs').insert([{
                    user_id: activeUser.id,
                    phone: activeUser.phone,
                    image_url: base64Image,
                    proof_type: selectedProofType,
                    amount: amt,
                    caption: caption || `Received ₹${amt} successfully!`,
                    likes_count: 1
                }]);

                if (error) throw error;

                alert("🎉 Screenshot Community Feed par publish ho gaya!");
                base64Image = null;
                document.getElementById('imagePreview').style.display = 'none';
                document.getElementById('proofAmtInput').value = '';
                document.getElementById('proofCaptionInput').value = '';
                document.getElementById('dropText').innerText = "Tap to Upload Screenshot";

                loadProofsFeed();

            } catch (err) {
                alert("Upload failed: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Share Proof with Community';
            }
        }

        async function loadProofsFeed() {
            const sb = getSupabase();
            if (!sb) return;

            try {
                const { data: proofs, error } = await sb
                    .from('payment_proofs')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allProofsData = proofs || [];
                renderFeed(allProofsData);

            } catch (err) {
                console.error(err);
            }
        }

        function filterProofs(category, el) {
            currentFilter = category;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');

            if (category === 'all') {
                renderFeed(allProofsData);
            } else {
                renderFeed(allProofsData.filter(p => p.proof_type === category));
            }
        }

        function renderFeed(list) {
            const feed = document.getElementById('proofsFeed');
            if (!list || list.length === 0) {
                feed.innerHTML = `
                    <div style="text-align: center; padding: 40px; background: white; border-radius: 20px; border: 1.5px dashed #cbd5e1;">
                        <i class="fa-regular fa-image" style="font-size: 32px; color: #cbd5e1; margin-bottom: 8px;"></i>
                        <p style="font-size: 13px; color: #94a3b8; font-weight: 700;">Is category mein abhi koi proof nahi hai. Sabse pehla post karein!</p>
                    </div>
                `;
                return;
            }

            feed.innerHTML = list.map(p => {
                const phoneStr = p.phone || "9999999999";
                const maskedPhone = `+91 ${phoneStr.substring(0, 3)}****${phoneStr.substring(7)}`;
                const timeAgo = p.created_at ? new Date(p.created_at).toLocaleDateString('en-IN') : 'Recent';
                
                let badgeClass = 'type-bank';
                let labelText = '🏦 Bank Credit';
                if (p.proof_type === 'referral') { badgeClass = 'type-referral'; labelText = '👥 Referral Reward'; }
                if (p.proof_type === 'withdrawal') { badgeClass = 'type-withdrawal'; labelText = '💳 Payout Record'; }
                if (p.proof_type === 'yield') { badgeClass = 'type-yield'; labelText = '🌱 Daily Harvest'; }

                const amountText = parseFloat(p.amount) > 0 ? `₹${parseFloat(p.amount).toFixed(0)}` : 'Verified';

                return `
                    <div class="proof-post">
                        <div class="post-header">
                            <div class="user-block">
                                <div class="user-avatar"><i class="fa-solid fa-shield-halved"></i></div>
                                <div>
                                    <strong style="font-size: 13px; color: #0f172a; display: block;">${maskedPhone}</strong>
                                    <span style="font-size: 11px; color: #64748b; font-weight: 600;">${timeAgo}</span>
                                </div>
                            </div>
                            <span class="badge-type ${badgeClass}">${labelText}</span>
                        </div>

                        <div class="proof-image-box">
                            <img src="${p.image_url}" alt="Payment Proof">
                        </div>

                        <div class="post-footer">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                                <strong style="font-size: 16px; color: #16a34a; font-weight: 900;">${amountText}</strong>
                                <span style="font-size: 11px; color: #15803d; font-weight: 800; background: #dcfce7; padding: 2px 8px; border-radius: 6px;">100% Guaranteed</span>
                            </div>
                            <p class="post-caption">${p.caption || ''}</p>
                            <div class="post-actions">
                                <button onclick="likePost('${p.id}', this)" class="like-btn">
                                    <i class="fa-solid fa-heart"></i> <span class="like-num">${p.likes_count || 1}</span> Likes
                                </button>
                                <span style="font-size: 11px; color: #64748b; font-weight: 700;">AgroHarvest Verified</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function likePost(id, btn) {
            const numEl = btn.querySelector('.like-num');
            let count = parseInt(numEl.innerText) + 1;
            numEl.innerText = count;
            btn.style.color = "#b91c1c";
            btn.disabled = true;

            const sb = getSupabase();
            if (sb) {
                await sb.from('payment_proofs').update({ likes_count: count }).eq('id', id);
            }
        }
    </script>
</body>
</html>

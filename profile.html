<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroHarvest - Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0f172a; display: flex; justify-content: center; min-height: 100vh; color: #0f172a; }
        .app-container { width: 100%; max-width: 430px; background: #f8fafc; min-height: 100vh; padding-bottom: 95px; position: relative; box-shadow: 0 0 35px rgba(0,0,0,0.15); }

        /* Harvester Header with Clean Dark Overlay */
        .profile-hero { height: 210px; width: 100%; position: relative; overflow: hidden; background: #14532d; }
        .profile-hero img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
        .profile-hero-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,83,45,0.7) 0%, rgba(15,23,42,0.92) 100%); display: flex; align-items: center; justify-content: center; flex-direction: column; color: white; padding-top: 10px; }
        
        .avatar-wrap { width: 68px; height: 68px; background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; border: 2.5px solid rgba(255,255,255,0.8); box-shadow: 0 8px 20px rgba(0,0,0,0.25); margin-bottom: 8px; }
        .profile-hero-overlay h3 { font-size: 18px; font-weight: 900; letter-spacing: -0.3px; }
        .profile-hero-overlay p { font-size: 11px; opacity: 0.85; font-weight: 700; margin-top: 2px; }

        /* Balance Card */
        .balance-card { background: #ffffff; margin: -26px 16px 16px; border-radius: 22px; padding: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.04); border: 1.5px solid #e2e8f0; text-align: center; position: relative; z-index: 10; }
        .balance-item:first-child { border-right: 1px solid #f1f5f9; }
        .balance-item p { font-size: 11px; color: #64748b; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
        .balance-item h2 { font-size: 21px; font-weight: 900; color: #16a34a; }

        /* Modern Services Menu */
        .menu-list { padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }
        .menu-item { background: #ffffff; border: 1.5px solid #e2e8f0; padding: 14px 16px; border-radius: 18px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: #1e293b; font-weight: 800; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.02); transition: transform 0.15s; }
        .menu-item:active { transform: scale(0.98); }
        .menu-left { display: flex; align-items: center; gap: 14px; }
        .menu-icon { width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 18px; }

        .icon-recharge { background: #dcfce7; color: #16a34a; }
        .icon-withdraw { background: #dbeafe; color: #2563eb; }
        .icon-orders { background: #fef3c7; color: #d97706; }
        .icon-support { background: #e0f2fe; color: #0284c7; }
        .icon-logout { background: #fee2e2; color: #dc2626; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 430px; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; align-items: center; padding: 10px 0 8px; z-index: 100; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); }
        .nav-item { text-align: center; text-decoration: none; color: #64748b; font-size: 11px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item i { font-size: 19px; }
        .nav-item.active { color: #16a34a; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Profile Harvester Banner -->
        <div class="profile-hero">
            <img src="https://images.unsplash.com/photo-1592982537447-7440770cbfc9?auto=format&fit=crop&w=1200&q=80" alt="AgroHarvest Harvester">
            <div class="profile-hero-overlay">
                <div class="avatar-wrap"><i class="fa-solid fa-user-shield"></i></div>
                <h3 id="profPhoneDisplay">+91 Loading...</h3>
                <p id="profUidDisplay">UID: --------</p>
            </div>
        </div>

        <!-- Balance Card -->
        <div class="balance-card">
            <div class="balance-item">
                <p>Available Balance</p>
                <h2 id="profBalText">₹0.00</h2>
            </div>
            <div class="balance-item">
                <p>Team Income</p>
                <h2 id="profTeamText">₹0.00</h2>
            </div>
        </div>

        <!-- Menu Action Links -->
        <div class="menu-list">
            <a href="recharge.html" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon icon-recharge"><i class="fa-solid fa-wallet"></i></div>
                    <span>Recharge Wallet</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: #cbd5e1; font-size: 13px;"></i>
            </a>

            <a href="withdraw.html" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon icon-withdraw"><i class="fa-solid fa-money-bill-transfer"></i></div>
                    <span>Withdraw Funds</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: #cbd5e1; font-size: 13px;"></i>
            </a>

            <a href="orders.html" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon icon-orders"><i class="fa-solid fa-boxes-stacked"></i></div>
                    <span>Crop Plans</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: #cbd5e1; font-size: 13px;"></i>
            </a>

            <a href="https://t.me/Earnflowseeds" target="_blank" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon icon-support"><i class="fa-brands fa-telegram"></i></div>
                    <span>Telegram Official Support</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: #cbd5e1; font-size: 13px;"></i>
            </a>

            <div onclick="logoutUser()" class="menu-item" style="cursor: pointer;">
                <div class="menu-left">
                    <div class="menu-icon icon-logout"><i class="fa-solid fa-right-from-bracket"></i></div>
                    <span style="color: #dc2626;">Logout Account</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: #cbd5e1; font-size: 13px;"></i>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="orders.html" class="nav-item"><i class="fa-solid fa-seedling"></i><span>Seeds</span></a>
            <a href="team.html" class="nav-item"><i class="fa-solid fa-users"></i><span>Team</span></a>
            <a href="profile.html" class="nav-item active"><i class="fa-solid fa-user"></i><span>Profile</span></a>
        </div>
    </div>

    <script>
        const activeUser = requireAuth();

        document.addEventListener("DOMContentLoaded", async () => {
            if (!activeUser) return;

            document.getElementById('profPhoneDisplay').innerText = "+91 " + activeUser.phone;
            document.getElementById('profUidDisplay').innerText = "UID: " + (activeUser.id ? activeUser.id.substring(0, 8).toUpperCase() : "--------");
            document.getElementById('profBalText').innerText = "₹" + parseFloat(activeUser.balance || 0).toFixed(2);
            document.getElementById('profTeamText').innerText = "₹" + parseFloat(activeUser.team_income || 0).toFixed(2);

            const sb = getSupabase();
            if (!sb) return;

            const { data: prof } = await sb
                .from('profiles')
                .select('*')
                .eq('id', activeUser.id)
                .maybeSingle();

            if (prof) {
                setSessionUser(prof);
                document.getElementById('profBalText').innerText = "₹" + parseFloat(prof.balance || 0).toFixed(2);
                document.getElementById('profTeamText').innerText = "₹" + parseFloat(prof.team_income || 0).toFixed(2);
            }
        });
    </script>
</body>
</html>

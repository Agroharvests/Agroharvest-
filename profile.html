<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroHarvest - Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f4fbf5; display: flex; justify-content: center; min-height: 100vh; color: #0f172a; }
        .app-container { width: 100%; max-width: 440px; background: #ffffff; min-height: 100vh; padding-bottom: 95px; position: relative; }

        .profile-hero { height: 180px; width: 100%; position: relative; background: #166534; overflow: hidden; }
        .profile-hero img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
        .profile-hero-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(20,83,45,0.85) 100%); display: flex; align-items: center; justify-content: center; flex-direction: column; color: white; padding-top: 10px; }
        
        .avatar-wrap { width: 62px; height: 62px; background: rgba(255,255,255,0.25); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; border: 2px solid white; box-shadow: 0 4px 14px rgba(0,0,0,0.2); }
        .profile-hero-overlay h3 { font-size: 17px; font-weight: 800; margin-top: 6px; }
        .profile-hero-overlay p { font-size: 11px; opacity: 0.9; }

        .balance-card { background: white; margin: -20px 16px 16px; border-radius: 20px; padding: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; box-shadow: 0 4px 18px rgba(0,0,0,0.06); border: 1.5px solid #f1f5f9; text-align: center; position: relative; z-index: 10; }
        .balance-item:first-child { border-right: 1px solid #e2e8f0; }
        .balance-item p { font-size: 11px; color: #64748b; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
        .balance-item h2 { font-size: 20px; font-weight: 800; color: #16a34a; }

        .menu-list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
        .menu-item { background: #ffffff; border: 1.5px solid #f1f5f9; padding: 14px 16px; border-radius: 16px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: #1e293b; font-weight: 700; font-size: 14px; }
        .menu-left { display: flex; align-items: center; gap: 12px; }
        .menu-icon { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 17px; }

        .icon-recharge { background: #dcfce7; color: #16a34a; }
        .icon-withdraw { background: #dbeafe; color: #2563eb; }
        .icon-orders { background: #fef3c7; color: #d97706; }
        .icon-support { background: #e0f2fe; color: #0284c7; }
        .icon-logout { background: #fee2e2; color: #dc2626; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 440px; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; align-items: center; padding: 8px 0; z-index: 100; }
        .nav-item { text-align: center; text-decoration: none; color: #64748b; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: #16a34a; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="profile-hero">
            <img src="banner.png" alt="AgroHarvest Poster">
            <div class="profile-hero-overlay">
                <div class="avatar-wrap"><i class="fa-solid fa-user-shield"></i></div>
                <h3 id="profPhoneDisplay">+91 Loading...</h3>
                <p id="profUidDisplay">UID: --------</p>
            </div>
        </div>

        <div class="balance-card">
            <div class="balance-item">
                <p>Available Balance</p>
                <h2 id="profBalText">₹0.00</h2>
            </div>
            <div class="balance-item">
                <p>Team Income</p>
                <h2 id="profTeamText">₹0.00</h2>
            </div>
        </div>

        <div class="menu-list">
            <a href="recharge.html" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon icon-recharge"><i class="fa-solid fa-wallet"></i></div>
                    <span>Recharge Wallet</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs" style="color: #cbd5e1;"></i>
            </a>

            <a href="withdraw.html" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon icon-withdraw"><i class="fa-solid fa-money-bill-transfer"></i></div>
                    <span>Withdraw Funds</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs" style="color: #cbd5e1;"></i>
            </a>

            <a href="orders.html" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon icon-orders"><i class="fa-solid fa-boxes-stacked"></i></div>
                    <span>Crop Plans</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs" style="color: #cbd5e1;"></i>
            </a>

            <a href="https://t.me/Earnflowseeds" target="_blank" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon icon-support"><i class="fa-brands fa-telegram"></i></div>
                    <span>Support</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs" style="color: #cbd5e1;"></i>
            </a>

            <div onclick="logoutUser()" class="menu-item" style="cursor: pointer;">
                <div class="menu-left">
                    <div class="menu-icon icon-logout"><i class="fa-solid fa-right-from-bracket"></i></div>
                    <span style="color: #dc2626;">Logout Account</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs" style="color: #cbd5e1;"></i>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="orders.html" class="nav-item"><i class="fa-solid fa-boxes-stacked"></i><span>Seeds</span></a>
            <a href="team.html" class="nav-item"><i class="fa-solid fa-users"></i><span>Team</span></a>
            <a href="profile.html" class="nav-item active"><i class="fa-solid fa-user"></i><span>Profile</span></a>
        </div>
    </div>

    <script>
        const activeUser = requireAuth();

        document.addEventListener("DOMContentLoaded", async () => {
            document.getElementById('profPhoneDisplay').innerText = "+91 " + activeUser.phone;
            document.getElementById('profUidDisplay').innerText = "UID: " + activeUser.id.substring(0, 8).toUpperCase();
            document.getElementById('profBalText').innerText = "₹" + parseFloat(activeUser.balance || 0).toFixed(2);
            document.getElementById('profTeamText').innerText = "₹" + parseFloat(activeUser.team_income || 0).toFixed(2);

            const { data: prof } = await supabase.from('profiles').select('*').eq('id', activeUser.id).single();
            if (prof) {
                setSessionUser(prof);
                document.getElementById('profBalText').innerText = "₹" + parseFloat(prof.balance || 0).toFixed(2);
                document.getElementById('profTeamText').innerText = "₹" + parseFloat(prof.team_income || 0).toFixed(2);
            }
        });
    </script>
</body>
</html>

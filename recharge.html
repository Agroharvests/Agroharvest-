<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroHarvest - Recharge Wallet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f4fbf5; display: flex; justify-content: center; min-height: 100vh; color: #0f172a; }
        .app-container { width: 100%; max-width: 440px; background: #ffffff; min-height: 100vh; padding-bottom: 30px; position: relative; }
        
        .header { background: linear-gradient(135deg, #14532d, #16a34a); padding: 18px 16px; color: white; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 17px; font-weight: 800; }
        .back-btn { color: white; text-decoration: none; font-size: 18px; }

        .content { padding: 18px 16px; }
        .amount-box { background: #f0fdf4; border: 1.5px solid #bbf7d0; border-radius: 18px; padding: 18px; margin-bottom: 20px; }
        .amount-box label { font-size: 12px; font-weight: 700; color: #166534; display: block; margin-bottom: 8px; }
        .amount-input-wrap { display: flex; align-items: center; gap: 8px; background: white; border: 1.5px solid #86efac; border-radius: 12px; padding: 10px 14px; }
        .amount-input-wrap span { font-size: 20px; font-weight: 800; color: #15803d; }
        .amount-input-wrap input { border: none; outline: none; font-size: 20px; font-weight: 800; color: #0f172a; width: 100%; }

        .quick-amounts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
        .quick-btn { background: white; border: 1px solid #bbf7d0; border-radius: 10px; padding: 10px; font-weight: 800; font-size: 13px; color: #166534; cursor: pointer; }
        .quick-btn:active { background: #dcfce7; }

        .qr-section { background: white; border: 1.5px solid #e2e8f0; border-radius: 20px; padding: 20px 16px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 20px; }
        .upi-box { background: #f8fafc; border: 1px dashed #94a3b8; border-radius: 12px; padding: 10px; display: flex; align-items: center; justify-content: space-between; margin: 14px 0; font-weight: 700; font-size: 13px; }
        .btn-copy { background: #16a34a; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }

        .utr-group { margin-bottom: 20px; }
        .utr-group label { font-size: 13px; font-weight: 700; color: #334155; display: block; margin-bottom: 8px; }
        .utr-input { width: 100%; padding: 14px; border: 1.5px solid #cbd5e1; border-radius: 14px; font-size: 15px; font-weight: 700; color: #0f172a; outline: none; }
        .utr-input:focus { border-color: #16a34a; }

        .btn-submit { width: 100%; background: linear-gradient(135deg, #16a34a, #15803d); color: white; border: none; padding: 15px; border-radius: 14px; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3); }
        .btn-submit:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h1>Recharge Wallet</h1>
            <div style="width: 20px;"></div>
        </div>

        <div class="content">
            <div class="amount-box">
                <label>ENTER RECHARGE AMOUNT</label>
                <div class="amount-input-wrap">
                    <span>₹</span>
                    <input type="number" id="rechargeAmount" value="525" placeholder="Amount">
                </div>
                <div class="quick-amounts">
                    <button class="quick-btn" onclick="setAmt(525)">₹525</button>
                    <button class="quick-btn" onclick="setAmt(1500)">₹1,500</button>
                    <button class="quick-btn" onclick="setAmt(3500)">₹3,500</button>
                </div>
            </div>

            <div class="qr-section">
                <h3 style="font-size: 15px; font-weight: 800; color: #0f172a;">UPI Payment</h3>
                <p style="font-size: 12px; color: #64748b; margin-top: 4px;">Copy UPI ID & pay through GPay, PhonePe, Paytm</p>

                <div class="upi-box">
                    <span id="upiIdText">paytmqr1ag8wsq3@paytm</span>
                    <button class="btn-copy" onclick="copyUPI()">Copy</button>
                </div>

                <p style="font-size: 11px; color: #d97706; font-weight: 700;">
                    <i class="fa-solid fa-triangle-exclamation"></i> Payment karne ke baad 12-digit UTR/Ref number yahan submit karein.
                </p>
            </div>

            <div class="utr-group">
                <label>12-Digit UTR / Reference Number</label>
                <input type="text" id="utrNumber" class="utr-input" placeholder="e.g. 402938492019" maxlength="12">
            </div>

            <button onclick="submitRecharge()" id="submitBtn" class="btn-submit">
                Submit Recharge Request
            </button>
        </div>
    </div>

    <script>
        const activeUser = requireAuth();

        function setAmt(val) {
            document.getElementById('rechargeAmount').value = val;
        }

        function copyUPI() {
            const upi = document.getElementById('upiIdText').innerText;
            navigator.clipboard.writeText(upi).then(() => {
                alert("UPI ID copied!");
            });
        }

        async function submitRecharge() {
            const amt = parseFloat(document.getElementById('rechargeAmount').value);
            const utr = document.getElementById('utrNumber').value.trim();
            const btn = document.getElementById('submitBtn');

            if (!amt || amt < 100) {
                alert("Minimum recharge amount ₹100 hai!");
                return;
            }
            if (utr.length < 12) {
                alert("Kripya sahi 12-digit UTR number dalein!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Submitting...";

            try {
                const { error } = await supabase.from('recharges').insert([{
                    user_id: activeUser.id,
                    phone: activeUser.phone,
                    amount: amt,
                    utr: utr,
                    status: 'pending'
                }]);

                if (error) {
                    if (error.code === '23505') throw new Error("Yeh UTR number pehle hi use ho chuka hai!");
                    throw error;
                }

                alert("✅ Recharge request submitted! Admin verification ke baad 5-10 minute me balance add ho jayega.");
                window.location.replace("index.html");

            } catch (err) {
                alert("Submission failed: " + err.message);
                btn.disabled = false;
                btn.innerText = "Submit Recharge Request";
            }
        }
    </script>
</body>
              </html>

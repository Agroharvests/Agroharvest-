<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroHarvest - Recharge Wallet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #0f172a; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 430px; background: #f8fafc; min-height: 100vh; padding-bottom: 30px; position: relative; }
        .top-header { background: #ffffff; padding: 18px 20px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #e2e8f0; font-weight: 800; font-size: 17px; }
        .card { background: white; margin: 16px; border-radius: 20px; padding: 20px; border: 1.5px solid #e2e8f0; }
        .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .amount-pill { background: #f8fafc; border: 1.5px solid #cbd5e1; padding: 10px; border-radius: 12px; font-weight: 800; text-align: center; cursor: pointer; color: #0f172a; }
        .amount-pill.active { background: #dcfce7; border-color: #16a34a; color: #16a34a; }
        .input-box { width: 100%; border: 1.5px solid #e2e8f0; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 800; outline: none; margin-top: 8px; }
        .input-box:focus { border-color: #16a34a; }
        .upi-box { background: #f0fdf4; border: 1.5px dashed #16a34a; padding: 14px; border-radius: 16px; margin: 16px 0; display: flex; justify-content: space-between; align-items: center; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #15803d, #16a34a); color: white; border: none; padding: 15px; border-radius: 16px; font-weight: 800; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-header">
            <a href="index.html" style="color: #0f172a; text-decoration: none;"><i class="fa-solid fa-arrow-left"></i></a>
            <span>Recharge Wallet</span>
        </div>

        <div class="card">
            <h3 style="font-size: 15px; font-weight: 800;">Select / Enter Amount</h3>
            <div class="quick-grid">
                <div class="amount-pill active" onclick="setAmt(525, this)">₹525</div>
                <div class="amount-pill" onclick="setAmt(1500, this)">₹1,500</div>
                <div class="amount-pill" onclick="setAmt(3500, this)">₹3,500</div>
            </div>
            <input type="number" id="rechargeAmt" class="input-box" value="525" placeholder="Enter amount">

            <div class="upi-box">
                <div>
                    <p style="font-size: 11px; color: #64748b; font-weight: 700;">Official Payment UPI ID</p>
                    <h4 id="adminUpiDisplay" style="font-size: 15px; font-weight: 900; color: #16a34a;">agroharvest@upi</h4>
                </div>
                <button onclick="copyUpi()" style="background: #16a34a; color: white; border: none; padding: 8px 12px; border-radius: 10px; font-weight: 800; font-size: 12px; cursor: pointer;">Copy</button>
            </div>

            <p style="font-size: 12px; color: #64748b; font-weight: 600;">Pay via PhonePe / GPay / Paytm & enter the 12-Digit UTR below:</p>
            <input type="text" id="utrNumber" class="input-box" placeholder="Enter 12 Digit UTR Number" maxlength="16" required>

            <button onclick="submitRecharge()" id="subBtn" class="btn-submit" style="margin-top: 18px;">Submit UTR</button>
        </div>
    </div>

    <script>
        const activeUser = requireAuth();

        document.addEventListener("DOMContentLoaded", async () => {
            const sb = getSupabase();
            if (sb) {
                const { data } = await sb.from('settings').select('value').eq('key', 'upi_id').maybeSingle();
                if (data) document.getElementById('adminUpiDisplay').innerText = data.value;
            }
        });

        function setAmt(val, el) {
            document.getElementById('rechargeAmt').value = val;
            document.querySelectorAll('.amount-pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
        }

        function copyUpi() {
            const upi = document.getElementById('adminUpiDisplay').innerText;
            navigator.clipboard.writeText(upi).then(() => alert("UPI ID Copied!"));
        }

        async function submitRecharge() {
            const amt = parseFloat(document.getElementById('rechargeAmt').value);
            const utr = document.getElementById('utrNumber').value.trim();
            const btn = document.getElementById('subBtn');

            if (!amt || amt < 500) return alert("Minimum recharge amount ₹500 hai!");
            if (!utr || utr.length < 10) return alert("Kripya sahi 12-digit UTR number dalein!");

            const sb = getSupabase();
            if (!sb) return alert("Database connecting...");

            btn.disabled = true;
            btn.innerText = "Submitting...";

            try {
                const { error } = await sb.from('recharges').insert([{
                    user_id: activeUser.id,
                    amount: amt,
                    utr: utr,
                    status: 'pending'
                }]);

                if (error) {
                    if (error.message.includes('unique') || error.message.includes('utr')) {
                        throw new Error("Yeh UTR pehle se submit kiya ja chuka hai! Duplicate UTR allow nahi hai.");
                    }
                    throw error;
                }

                alert("✅ Recharge request submitted! Admin 10-15 minute me verify karke approve kar dega.");
                window.location.href = "index.html";

            } catch (err) {
                alert("Error: " + err.message);
                btn.disabled = false;
                btn.innerText = "Submit UTR";
            }
        }
    </script>
</body>
</html>

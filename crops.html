<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroHarvest - My Purchased Seeds</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0b1329; display: flex; justify-content: center; min-height: 100vh; color: #0f172a; }
        .app-container { width: 100%; max-width: 430px; background: #f8fafc; min-height: 100vh; padding-bottom: 95px; position: relative; box-shadow: 0 0 35px rgba(0,0,0,0.25); }

        .top-header { background: #ffffff; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e2e8f0; font-weight: 800; font-size: 17px; position: sticky; top: 0; z-index: 50; }
        
        .summary-card { margin: 16px; background: linear-gradient(135deg, #14532d, #16a34a); border-radius: 20px; padding: 18px; color: white; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 20px rgba(22, 163, 74, 0.25); }
        .summary-card p { font-size: 11px; font-weight: 700; text-transform: uppercase; opacity: 0.9; }
        .summary-card h3 { font-size: 22px; font-weight: 900; margin-top: 2px; }

        .orders-box { padding: 0 16px; display: flex; flex-direction: column; gap: 14px; }
        .order-card { background: white; border: 1.5px solid #e2e8f0; border-radius: 20px; padding: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.03); }
        
        .order-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .order-title { font-size: 16px; font-weight: 900; color: #0f172a; }
        .badge-status { font-size: 11px; font-weight: 900; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; }
        .badge-active { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .badge-completed { background: #f1f5f9; color: #64748b; }

        .order-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 10px; text-align: center; }
        .stat-item span { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 2px; }
        .stat-item strong { font-size: 14px; font-weight: 900; color: #0f172a; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 430px; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; align-items: center; padding: 10px 0 8px; z-index: 100; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); }
        .nav-item { text-align: center; text-decoration: none; color: #64748b; font-size: 11px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item i { font-size: 19px; }
        .nav-item.active { color: #16a34a; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <a href="index.html" style="color: #0f172a; text-decoration: none;"><i class="fa-solid fa-arrow-left"></i></a>
                <span>My Purchased Seeds</span>
            </div>
            <span id="activeCountBadge" style="font-size: 11px; background: #dcfce7; color: #16a34a; padding: 4px 10px; border-radius: 10px; font-weight: 800;">0 ACTIVE</span>
        </div>

        <div class="summary-card">
            <div>
                <p>Total Daily Income</p>
                <h3 id="totalDailyIncomeText">₹0.00 / day</h3>
            </div>
            <div style="width: 44px; height: 44px; background: rgba(255,255,255,0.2); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 20px;">
                <i class="fa-solid fa-seedling"></i>
            </div>
        </div>

        <div class="orders-box" id="ordersListContainer">
            <div style="text-align: center; padding: 40px 20px; color: #94a3b8; font-weight: 700;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; color: #16a34a; margin-bottom: 10px;"></i>
                <p>Loading your seed plans...</p>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="orders.html" class="nav-item active"><i class="fa-solid fa-seedling"></i><span>Seeds</span></a>
            <a href="team.html" class="nav-item"><i class="fa-solid fa-users"></i><span>Team</span></a>
            <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Profile</span></a>
        </div>
    </div>

    <script>
        const activeUser = requireAuth();

        document.addEventListener("DOMContentLoaded", loadUserOrders);

         async function loadUserOrders() {
    if (!activeUser) return;
    const sb = getSupabase();
    const container = document.getElementById('ordersListContainer');

    try {
        // 1. Fetch User Active Orders
        const { data: userOrders } = await sb
            .from('orders')
            .select('*')
            .eq('user_id', activeUser.id)
            .order('created_at', { ascending: false });

        // 2. Fetch Daily Income Transactions
        const { data: incomeLogs } = await sb
            .from('transactions')
            .select('*')
            .eq('user_id', activeUser.id)
            .eq('type', 'income')
            .order('created_at', { ascending: false });

        const activeOrders = (userOrders || []).filter(o => o.status === 'active');
        const totalDaily = activeOrders.reduce((sum, o) => sum + parseFloat(o.daily_income || 0), 0);

        document.getElementById('activeCountBadge').innerText = `${activeOrders.length} ACTIVE`;
        document.getElementById('totalDailyIncomeText').innerText = `₹${totalDaily.toFixed(2)} / day`;

        // Render Active Crops
        let htmlContent = (userOrders || []).map(o => `
            <div class="order-card" style="background:white; border-radius:18px; padding:16px; margin-bottom:12px; border:1.5px solid #e2e8f0;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <strong style="font-size:15px; color:#0f172a;">${o.plan_name}</strong>
                    <span style="font-size:11px; font-weight:800; background:#dcfce7; color:#15803d; padding:3px 8px; border-radius:6px;">${o.status}</span>
                </div>
                <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; text-align:center; background:#f8fafc; padding:10px; border-radius:12px;">
                    <div><span style="font-size:10px; color:#64748b; font-weight:700;">Price</span><h5 style="font-size:13px; font-weight:900;">₹${o.price}</h5></div>
                    <div><span style="font-size:10px; color:#64748b; font-weight:700;">Daily Return</span><h5 style="font-size:13px; font-weight:900; color:#16a34a;">+₹${o.daily_income}</h5></div>
                    <div><span style="font-size:10px; color:#64748b; font-weight:700;">Days Left</span><h5 style="font-size:13px; font-weight:900; color:#0284c7;">${o.days_remaining} Days</h5></div>
                </div>
            </div>
        `).join('');

        // Render Daily Income History Passbook
        htmlContent += `
            <div style="margin-top:24px; margin-bottom:12px;">
                <h4 style="font-size:15px; font-weight:900; color:#0f172a;">Daily Harvest Credit History</h4>
            </div>
        `;

        if (!incomeLogs || incomeLogs.length === 0) {
            htmlContent += `<p style="font-size:12px; color:#94a3b8; font-weight:700; text-align:center; padding:16px;">Abhi tak koi daily return credit nahi hua hai.</p>`;
        } else {
            htmlContent += incomeLogs.map(log => {
                const dateStr = log.created_at ? new Date(log.created_at).toLocaleDateString('en-IN') : 'Recent';
                return `
                    <div style="background:white; border-radius:14px; padding:12px 14px; margin-bottom:8px; border:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <strong style="font-size:13px; color:#0f172a; display:block;">${log.details}</strong>
                            <span style="font-size:11px; color:#64748b; font-weight:600;">${dateStr}</span>
                        </div>
                        <strong style="font-size:15px; color:#16a34a; font-weight:900;">+₹${parseFloat(log.amount).toFixed(2)}</strong>
                    </div>
                `;
            }).join('');
        }

        container.innerHTML = htmlContent;

    } catch (err) {
        container.innerHTML = `<p style="color:#ef4444; text-align:center; padding:20px;">Error: ${err.message}</p>`;
    }
                                                                            }
        
    </script>
</body>
</html>

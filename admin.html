<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroHarvest - Master Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #0f172a; display: flex; justify-content: center; min-height: 100vh; }
        .admin-app { width: 100%; max-width: 500px; background: #f8fafc; min-height: 100vh; padding-bottom: 40px; }
        .top-header { background: #0f172a; padding: 20px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .card { background: white; margin: 14px; border-radius: 18px; padding: 18px; border: 1.5px solid #e2e8f0; }
        .input-box { width: 100%; border: 1.5px solid #e2e8f0; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 700; outline: none; margin-top: 6px; margin-bottom: 10px; }
        .btn-action { padding: 8px 12px; border-radius: 10px; border: none; font-weight: 800; font-size: 12px; cursor: pointer; }
        .btn-green { background: #16a34a; color: white; }
        .btn-red { background: #dc2626; color: white; }
        .item-row { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 14px; padding: 12px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="admin-app">
        <div class="top-header">
            <h2 style="font-size: 18px; font-weight: 900;">AgroHarvest Master Admin</h2>
            <button onclick="runDailyIncomeManually()" style="background: #eab308; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 900; cursor: pointer;">Midnight Run</button>
        </div>

        <!-- 1. Dynamic UPI Control -->
        <div class="card">
            <h3 style="font-size: 15px; font-weight: 900; margin-bottom: 8px;">Update Receiver UPI ID</h3>
            <input type="text" id="adminNewUpi" class="input-box" placeholder="Enter new UPI ID (e.g. company@ybl)">
            <button onclick="updateUpi()" class="btn-action btn-green">Update UPI</button>
        </div>

        <!-- 2. Manual User Balance Adjust -->
        <div class="card">
            <h3 style="font-size: 15px; font-weight: 900; margin-bottom: 8px;">Adjust User Balance</h3>
            <input type="text" id="targetPhone" class="input-box" placeholder="User Mobile Number">
            <input type="number" id="adjustAmt" class="input-box" placeholder="Amount (+ Add or - Deduct)">
            <button onclick="adjustUserBalance()" class="btn-action btn-green">Update Balance</button>
        </div>

        <!-- 3. Pending Recharges -->
        <div class="card">
            <h3 style="font-size: 15px; font-weight: 900; margin-bottom: 10px;">Pending Recharges</h3>
            <div id="rechargesList">Loading...</div>
        </div>

        <!-- 4. Pending Withdrawals -->
        <div class="card">
            <h3 style="font-size: 15px; font-weight: 900; margin-bottom: 10px;">Pending Withdrawals</h3>
            <div id="withdrawalsList">Loading...</div>
        </div>
    </div>

    <script>
        const activeUser = requireAuth();
        if (activeUser.phone !== ADMIN_PHONE) {
            alert("Unauthorized Access!");
            window.location.replace("index.html");
        }

        document.addEventListener("DOMContentLoaded", loadAdminData);

        async function loadAdminData() {
            const sb = getSupabase();
            if (!sb) return;

            // Load Pending Recharges
            const { data: rList } = await sb.from('recharges').select('*, profiles(phone)').eq('status', 'pending');
            const rDiv = document.getElementById('rechargesList');
            if (!rList || rList.length === 0) {
                rDiv.innerHTML = `<p style="font-size: 12px; color: #94a3b8; font-weight: 700;">No pending recharges.</p>`;
            } else {
                rDiv.innerHTML = rList.map(r => `
                    <div class="item-row">
                        <div style="font-size: 13px; font-weight: 800;">${r.profiles?.phone || 'User'} | Amount: ₹${r.amount}</div>
                        <div style="font-size: 11px; color: #16a34a; font-weight: 800;">UTR: ${r.utr}</div>
                        <div style="margin-top: 8px; display: flex; gap: 8px;">
                            <button onclick="approveRecharge('${r.id}', '${r.user_id}', ${r.amount})" class="btn-action btn-green">Approve</button>
                            <button onclick="rejectRecharge('${r.id}')" class="btn-action btn-red">Reject</button>
                        </div>
                    </div>
                `).join('');
            }

            // Load Pending Withdrawals
            const { data: wList } = await sb.from('withdrawals').select('*, profiles(phone)').eq('status', 'pending');
            const wDiv = document.getElementById('withdrawalsList');
            if (!wList || wList.length === 0) {
                wDiv.innerHTML = `<p style="font-size: 12px; color: #94a3b8; font-weight: 700;">No pending withdrawals.</p>`;
            } else {
                wDiv.innerHTML = wList.map(w => `
                    <div class="item-row">
                        <div style="font-size: 13px; font-weight: 800;">${w.profiles?.phone || 'User'} | Payout: ₹${w.final_amount} (Fee ₹${w.fee_amount})</div>
                        <div style="font-size: 11px; color: #64748b; font-weight: 700;">Acc: ${w.account_number} | IFSC: ${w.ifsc_code} | Name: ${w.holder_name}</div>
                        <div style="margin-top: 8px; display: flex; gap: 8px;">
                            <button onclick="approveWithdrawal('${w.id}')" class="btn-action btn-green">Mark Paid</button>
                            <button onclick="rejectWithdrawal('${w.id}', '${w.user_id}', ${w.amount})" class="btn-action btn-red">Reject & Refund</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        async function updateUpi() {
            const upi = document.getElementById('adminNewUpi').value.trim();
            if (!upi) return alert("Enter UPI ID!");
            const sb = getSupabase();
            await sb.from('settings').upsert({ key: 'upi_id', value: upi });
            alert("UPI ID Updated!");
        }

        async function adjustUserBalance() {
            const phone = document.getElementById('targetPhone').value.trim();
            const amt = parseFloat(document.getElementById('adjustAmt').value);
            if (!phone || isNaN(amt)) return alert("Enter valid phone and amount!");

            const sb = getSupabase();
            const { data: user } = await sb.from('profiles').select('id, balance').eq('phone', phone).single();
            if (!user) return alert("User not found!");

            await sb.from('profiles').update({ balance: user.balance + amt }).eq('id', user.id);
            alert("Balance Adjusted Successfully!");
        }

        async function approveRecharge(id, userId, amt) {
            const sb = getSupabase();
            await sb.from('recharges').update({ status: 'approved' }).eq('id', id);
            const { data: u } = await sb.from('profiles').select('balance').eq('id', userId).single();
            await sb.from('profiles').update({ balance: u.balance + amt }).eq('id', userId);
            alert("Recharge Approved & Balance Added!");
            loadAdminData();
        }

        async function rejectRecharge(id) {
            const sb = getSupabase();
            await sb.from('recharges').update({ status: 'rejected' }).eq('id', id);
            alert("Recharge Rejected!");
            loadAdminData();
        }

        async function approveWithdrawal(id) {
            const sb = getSupabase();
            await sb.from('withdrawals').update({ status: 'approved' }).eq('id', id);
            alert("Withdrawal marked as Paid!");
            loadAdminData();
        }

        async function rejectWithdrawal(id, userId, amt) {
            const sb = getSupabase();
            await sb.from('withdrawals').update({ status: 'rejected' }).eq('id', id);
            const { data: u } = await sb.from('profiles').select('balance').eq('id', userId).single();
            await sb.from('profiles').update({ balance: u.balance + amt }).eq('id', userId);
            alert("Withdrawal Rejected & Balance Refunded to User!");
            loadAdminData();
        }

        async function runDailyIncomeManually() {
            const sb = getSupabase();
            await sb.rpc('run_midnight_daily_income');
            alert("12:00 AM Daily Income Engine Executed Successfully!");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroHarvest - Withdraw Funds</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f4fbf5; display: flex; justify-content: center; min-height: 100vh; color: #0f172a; }
        .app-container { width: 100%; max-width: 440px; background: #ffffff; min-height: 100vh; padding-bottom: 30px; position: relative; }
        
        .header { background: linear-gradient(135deg, #14532d, #16a34a); padding: 18px 16px; color: white; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 17px; font-weight: 800; }
        .back-btn { color: white; text-decoration: none; font-size: 18px; }

        .content { padding: 18px 16px; }
        .balance-info { background: #f0fdf4; border: 1.5px solid #bbf7d0; border-radius: 18px; padding: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .balance-info p { font-size: 12px; color: #166534; font-weight: 700; }
        .balance-info h2 { font-size: 20px; color: #15803d; font-weight: 800; }

        .form-card { background: white; border: 1.5px solid #e2e8f0; border-radius: 20px; padding: 20px 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .input-group { margin-bottom: 14px; text-align: left; }
        .input-group label { font-size: 12px; font-weight: 700; color: #475569; display: block; margin-bottom: 6px; }
        .input-box { width: 100%; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 12px; font-size: 14px; font-weight: 700; color: #0f172a; outline: none; }
        .input-box:focus { border-color: #16a34a; }

        .notice-box { background: #fefce8; border: 1px solid #fef08a; border-radius: 12px; padding: 12px; margin: 16px 0; font-size: 11px; color: #854d0e; font-weight: 600; line-height: 1.5; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #16a34a, #15803d); color: white; border: none; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3); }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h1>Withdraw Funds</h1>
            <div style="width: 20px;"></div>
        </div>

        <div class="content">
            <div class="balance-info">
                <div>
                    <p>AVAILABLE BALANCE</p>
                    <h2 id="availBal">₹0.00</h2>
                </div>
                <i class="fa-solid fa-wallet" style="font-size: 28px; color: #16a34a;"></i>
            </div>

            <div class="form-card">
                <div class="input-group">
                    <label>Withdrawal Amount (Min ₹150)</label>
                    <input type="number" id="wAmount" class="input-box" placeholder="Amount (₹)">
                </div>

                <div class="input-group">
                    <label>Account Holder Name</label>
                    <input type="text" id="wName" class="input-box" placeholder="Name on Bank Account">
                </div>

                <div class="input-group">
                    <label>Bank Name</label>
                    <input type="text" id="wBank" class="input-box" placeholder="e.g. State Bank of India">
                </div>

                <div class="input-group">
                    <label>Bank Account Number</label>
                    <input type="text" id="wAcc" class="input-box" placeholder="Account Number">
                </div>

                <div class="input-group">
                    <label>IFSC Code</label>
                    <input type="text" id="wIfsc" class="input-box" placeholder="e.g. SBIN0001234">
                </div>

                <div class="notice-box">
                    <i class="fa-solid fa-circle-info"></i> Withdrawal rules:<br>
                    • Minimum withdrawal ₹150.<br>
                    • Daily timing: 09:00 AM to 06:00 PM.<br>
                    • 10% processing fee applicable.
                </div>

                <button onclick="submitWithdraw()" id="wBtn" class="btn-submit">Confirm Withdrawal</button>
            </div>
        </div>
    </div>

    <script>
        const activeUser = requireAuth();
        let userBalance = 0;

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: prof } = await supabase.from('profiles').select('balance').eq('id', activeUser.id).single();
            if (prof) {
                userBalance = parseFloat(prof.balance || 0);
                document.getElementById('availBal').innerText = "₹" + userBalance.toFixed(2);
            }
        });

        async function submitWithdraw() {
            const amt = parseFloat(document.getElementById('wAmount').value);
            const name = document.getElementById('wName').value.trim();
            const bank = document.getElementById('wBank').value.trim();
            const acc = document.getElementById('wAcc').value.trim();
            const ifsc = document.getElementById('wIfsc').value.trim();
            const btn = document.getElementById('wBtn');

            if (!amt || amt < 150) {
                alert("Minimum withdrawal ₹150 hai!");
                return;
            }
            if (amt > userBalance) {
                alert("Balance kam hai!");
                return;
            }
            if (!name || !bank || !acc || !ifsc) {
                alert("Kripya bank details poori bharein!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                // Deduct balance first
                const { error: balErr } = await supabase
                    .from('profiles')
                    .update({ balance: userBalance - amt })
                    .eq('id', activeUser.id);

                if (balErr) throw balErr;

                // Create withdrawal record
                const { error: wErr } = await supabase
                    .from('withdrawals')
                    .insert([{
                        user_id: activeUser.id,
                        phone: activeUser.phone,
                        amount: amt,
                        holder_name: name,
                        bank_name: bank,
                        account_no: acc,
                        ifsc_code: ifsc,
                        status: 'pending'
                    }]);

                if (wErr) throw wErr;

                // Passbook entry
                await supabase.from('transactions').insert([{
                    user_id: activeUser.id,
                    type: 'withdraw',
                    amount: amt,
                    status: 'pending',
                    details: `Withdrawal request to ${bank}`
                }]);

                alert("✅ Withdrawal request submitted successfully! Funds bank me transfer ho jayenge.");
                window.location.replace("profile.html");

            } catch (err) {
                alert("Withdrawal failed: " + err.message);
                btn.disabled = false;
                btn.innerText = "Confirm Withdrawal";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroHarvest - Withdraw Funds</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0b1329; display: flex; justify-content: center; min-height: 100vh; color: #0f172a; }
        .app-container { width: 100%; max-width: 430px; background: #f8fafc; min-height: 100vh; padding-bottom: 40px; position: relative; box-shadow: 0 0 35px rgba(0,0,0,0.25); }
        .top-header { background: #ffffff; padding: 18px 20px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #e2e8f0; font-weight: 800; font-size: 17px; position: sticky; top: 0; z-index: 50; }
        .card { background: white; margin: 16px; border-radius: 20px; padding: 20px; border: 1.5px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .input-box { width: 100%; border: 1.5px solid #e2e8f0; padding: 14px; border-radius: 14px; font-size: 14px; font-weight: 800; outline: none; margin-top: 6px; margin-bottom: 12px; }
        .input-box:disabled { background: #f1f5f9; color: #475569; }
        .summary-box { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 14px; padding: 12px; margin: 14px 0; font-size: 13px; font-weight: 700; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #15803d, #16a34a); color: white; border: none; padding: 15px; border-radius: 16px; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 6px 18px rgba(22, 163, 74, 0.3); }

        /* History Styling */
        .history-card { background: white; margin: 0 16px 20px; border-radius: 20px; padding: 18px; border: 1.5px solid #e2e8f0; }
        .history-item { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
        .badge-status { font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
        .badge-pending { background: #fef3c7; color: #b45309; }
        .badge-approved { background: #dcfce7; color: #15803d; }
        .badge-rejected { background: #fee2e2; color: #dc2626; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-header">
            <a href="index.html" style="color: #0f172a; text-decoration: none;"><i class="fa-solid fa-arrow-left"></i></a>
            <span>Withdraw Funds</span>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <span style="font-size: 13px; color: #64748b; font-weight: 700;">Withdrawable Balance</span>
                <span id="availBal" style="font-size: 18px; font-weight: 900; color: #16a34a;">₹0.00</span>
            </div>

            <label style="font-size: 12px; font-weight: 800; color: #0f172a;">Withdrawal Amount (Min ₹150)</label>
            <input type="number" id="withdrawAmt" class="input-box" placeholder="Enter amount" oninput="calculateBreakdown()">

            <label style="font-size: 12px; font-weight: 800; color: #0f172a;">Account Holder Name</label>
            <input type="text" id="bankHolder" class="input-box" placeholder="Full Name as per Bank">

            <label style="font-size: 12px; font-weight: 800; color: #0f172a;">Bank Account Number (Permanent Lock)</label>
            <input type="text" id="bankAcc" class="input-box" placeholder="Account Number">

            <label style="font-size: 12px; font-weight: 800; color: #0f172a;">IFSC Code</label>
            <input type="text" id="bankIfsc" class="input-box" placeholder="e.g. SBIN0001234">

            <div class="summary-box">
                <div class="summary-row"><span>Withdrawal Fee (10%):</span><span id="feeText" style="color: #dc2626;">- ₹0.00</span></div>
                <div class="summary-row" style="font-size: 15px; font-weight: 900; border-top: 1px solid #cbd5e1; padding-top: 6px;">
                    <span>Net Payout Amount:</span><span id="finalAmtText" style="color: #16a34a;">₹0.00</span>
                </div>
            </div>

            <p style="font-size: 11px; color: #64748b; font-weight: 600; margin-bottom: 14px;">
                ⏰ Payout Time: 00:30 AM to 05:00 PM | Limit: 1 request per day.
            </p>

            <button onclick="handleWithdrawal()" id="wdBtn" class="btn-submit">Request Withdrawal</button>
        </div>
                <!-- Live Withdrawal History Container -->
        <div class="history-card">
            <h3 style="font-size: 15px; font-weight: 900; color: #0f172a; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;">
                <span>Withdrawal History</span>
                <i class="fa-solid fa-clock-rotate-left" style="color: #16a34a;"></i>
            </h3>
            <div id="wdHistoryList">
                <p style="font-size: 12px; color: #94a3b8; font-weight: 700; text-align: center; padding: 10px;">Loading history...</p>
            </div>
        </div>
    </div>

    <script>
        const activeUser = requireAuth();
        let isBankLocked = false;

        document.addEventListener("DOMContentLoaded", async () => {
            await loadUserData();
            await loadWithdrawalHistory();
        });

        async function loadUserData() {
            const sb = getSupabase();
            if (!sb) return;

            const { data: prof } = await sb.from('profiles').select('balance').eq('id', activeUser.id).single();
            if (prof) document.getElementById('availBal').innerText = "₹" + parseFloat(prof.balance || 0).toFixed(2);

            const { data: bank } = await sb.from('bank_details').select('*').eq('user_id', activeUser.id).maybeSingle();
            if (bank) {
                isBankLocked = true;
                document.getElementById('bankHolder').value = bank.holder_name;
                document.getElementById('bankAcc').value = bank.account_number;
                document.getElementById('bankIfsc').value = bank.ifsc_code;

                document.getElementById('bankHolder').disabled = true;
                document.getElementById('bankAcc').disabled = true;
                document.getElementById('bankIfsc').disabled = true;
            }
        }

        async function loadWithdrawalHistory() {
            const sb = getSupabase();
            if (!sb) return;

            const { data: list } = await sb
                .from('withdrawals')
                .select('*')
                .eq('user_id', activeUser.id)
                .order('created_at', { ascending: false });

            const box = document.getElementById('wdHistoryList');
            if (!list || list.length === 0) {
                box.innerHTML = `<p style="font-size: 12px; color: #94a3b8; font-weight: 700; text-align: center; padding: 10px;">Abhi tak koi withdrawal request nahi lagayi gayi.</p>`;
                return;
            }

            box.innerHTML = list.map(item => {
                let badgeClass = 'badge-pending';
                if (item.status === 'approved') badgeClass = 'badge-approved';
                if (item.status === 'rejected') badgeClass = 'badge-rejected';

                const dateStr = item.created_at ? new Date(item.created_at).toLocaleDateString('en-IN') : 'Today';

                return `
                    <div class="history-item">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                            <strong style="font-size: 14px; color: #0f172a;">₹${parseFloat(item.amount).toFixed(2)}</strong>
                            <span class="badge-status ${badgeClass}">${item.status}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; font-size: 11px; color: #64748b; font-weight: 600;">
                            <span>Net Payout: ₹${parseFloat(item.final_amount).toFixed(2)} (Fee: ₹${parseFloat(item.fee_amount).toFixed(2)})</span>
                            <span>${dateStr}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function calculateBreakdown() {
            const amt = parseFloat(document.getElementById('withdrawAmt').value) || 0;
            const fee = amt * 0.10;
            const finalPayout = amt - fee;

            document.getElementById('feeText').innerText = "- ₹" + fee.toFixed(2);
            document.getElementById('finalAmtText').innerText = "₹" + (finalPayout > 0 ? finalPayout.toFixed(2) : "0.00");
        }

        function isWithinWithdrawalTime() {
            const now = new Date();
            const curMinutes = now.getHours() * 60 + now.getMinutes();
            return curMinutes >= 30 && curMinutes <= 1020; // 00:30 to 17:00 IST
        }

        async function handleWithdrawal() {
            if (!isWithinWithdrawalTime()) {
                return alert("Withdrawal ka samay 00:30 AM se 05:00 PM tak hai!");
            }

            const amt = parseFloat(document.getElementById('withdrawAmt').value);
            const holder = document.getElementById('bankHolder').value.trim();
            const acc = document.getElementById('bankAcc').value.trim();
            const ifsc = document.getElementById('bankIfsc').value.trim().toUpperCase();
            const btn = document.getElementById('wdBtn');

            if (!amt || amt < 150) return alert("Minimum withdrawal limit ₹150 hai!");
            if (!holder || !acc || !ifsc) return alert("Kripya saari bank details fill karein!");

            const sb = getSupabase();
            if (!sb) return alert("Connecting database...");

            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const today = new Date().toISOString().split('T')[0];
                const { data: todayWd } = await sb
                    .from('withdrawals')
                    .select('id')
                    .eq('user_id', activeUser.id)
                    .eq('request_date', today)
                    .maybeSingle();

                if (todayWd) throw new Error("Aap aaj ka 1 withdrawal request pehle hi submit kar chuke hain!");

                const { data: profile } = await sb.from('profiles').select('balance').eq('id', activeUser.id).single();
                if (parseFloat(profile.balance || 0) < amt) throw new Error("Balance insufficient hai!");

                if (!isBankLocked) {
                    const { error: bErr } = await sb.from('bank_details').insert([{
                        user_id: activeUser.id,
                        account_number: acc,
                        ifsc_code: ifsc,
                        holder_name: holder
                    }]);

                    if (bErr) {
                        if (bErr.message.includes('unique')) throw new Error("Yeh Bank Account kisi aur user ID ke sath linked hai!");
                        throw bErr;
                    }
                }

                const feeAmt = amt * 0.10;
                const finalPayout = amt - feeAmt;

                await sb.from('profiles').update({ balance: profile.balance - amt }).eq('id', activeUser.id);

                await sb.from('withdrawals').insert([{
                    user_id: activeUser.id,
                    amount: amt,
                    fee_amount: feeAmt,
                    final_amount: finalPayout,
                    account_number: acc,
                    ifsc_code: ifsc,
                    holder_name: holder,
                    status: 'pending'
                }]);

                await sb.from('transactions').insert([{
                    user_id: activeUser.id,
                    type: 'withdraw',
                    amount: amt,
                    details: `Withdrawal Requested: ₹${amt} (Net ₹${finalPayout.toFixed(2)})`
                }]);

                alert("🎉 Withdrawal Request Submitted!");
                document.getElementById('withdrawAmt').value = '';
                await loadUserData();
                await loadWithdrawalHistory();

            } catch (err) {
                alert("Withdrawal Failed: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Request Withdrawal";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroHarvest - Withdraw Funds</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0b1329; display: flex; justify-content: center; min-height: 100vh; color: #0f172a; }
        .app-container { width: 100%; max-width: 430px; background: #f8fafc; min-height: 100vh; padding-bottom: 50px; position: relative; box-shadow: 0 0 35px rgba(0,0,0,0.25); }

        .top-header { background: #ffffff; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e2e8f0; font-weight: 800; font-size: 17px; position: sticky; top: 0; z-index: 50; }
        .card { background: white; margin: 16px; border-radius: 24px; padding: 20px; border: 1.5px solid #e2e8f0; box-shadow: 0 4px 18px rgba(0,0,0,0.03); }

        .bal-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #f1f5f9; }
        .bal-row p { font-size: 14px; font-weight: 800; color: #64748b; }
        .bal-row h3 { font-size: 20px; font-weight: 900; color: #16a34a; }

        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; font-size: 12px; font-weight: 800; color: #334155; margin-bottom: 6px; }
        .input-box { width: 100%; border: 1.5px solid #e2e8f0; padding: 13px 14px; border-radius: 14px; font-size: 14px; font-weight: 700; outline: none; color: #0f172a; }
        .input-box:focus { border-color: #16a34a; }
        .input-box:disabled { background: #f1f5f9; color: #64748b; }

        .fee-calc-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
        .calc-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; margin-bottom: 4px; }
        .calc-row.final { font-size: 14px; font-weight: 900; margin-top: 6px; padding-top: 6px; border-top: 1px dashed #cbd5e1; }

        .rules-tag { font-size: 11px; color: #dc2626; font-weight: 700; line-height: 1.4; margin-bottom: 16px; }

        .btn-withdraw { width: 100%; background: linear-gradient(135deg, #15803d, #16a34a); color: white; border: none; padding: 14px; border-radius: 16px; font-weight: 900; font-size: 15px; cursor: pointer; box-shadow: 0 4px 14px rgba(22, 163, 74, 0.3); }
        .btn-withdraw:disabled { opacity: 0.6; cursor: not-allowed; }

        .history-card { background: white; margin: 0 16px 20px; border-radius: 20px; padding: 18px; border: 1.5px solid #e2e8f0; }
        .history-item { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
        .badge-status { font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
        .badge-approved { background: #dcfce7; color: #15803d; }
        .badge-pending { background: #fef3c7; color: #b45309; }
        .badge-rejected { background: #fee2e2; color: #dc2626; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <a href="index.html" style="color: #0f172a; text-decoration: none;"><i class="fa-solid fa-arrow-left"></i></a>
                <span>Withdraw Funds</span>
            </div>
            <i class="fa-solid fa-shield-check" style="color: #16a34a;"></i>
        </div>

        <div class="card">
            <div class="bal-row">
                <p>Withdrawable Balance</p>
                <h3 id="displayBal">₹0.00</h3>
            </div>

            <div class="input-group">
                <label>Withdrawal Amount (Min ₹150)</label>
                <input type="number" id="wdAmount" class="input-box" placeholder="Enter amount" oninput="calculateNetPayout()">
            </div>

            <div class="input-group">
                <label>Account Holder Name</label>
                <input type="text" id="holderName" class="input-box" placeholder="Full Name as per Bank">
            </div>

            <div class="input-group">
                <label>Bank Account Number (Permanent Lock)</label>
                <input type="text" id="accNumber" class="input-box" placeholder="Account Number">
            </div>

            <div class="input-group">
                <label>IFSC Code</label>
                <input type="text" id="ifscCode" class="input-box" placeholder="e.g. SBIN0001234" style="text-transform: uppercase;">
            </div>

            <div class="fee-calc-box">
                <div class="calc-row">
                    <span style="color: #64748b;">Withdrawal Fee (10%):</span>
                    <span id="feeDisplay" style="color: #dc2626;">- ₹0.00</span>
                </div>
                <div class="calc-row final">
                    <span style="color: #0f172a;">Net Payout Amount:</span>
                    <span id="netPayoutDisplay" style="color: #16a34a;">₹0.00</span>
                </div>
            </div>

            <div class="rules-tag">
                ⏰ Payout Time: 00:30 AM to 05:00 PM | Limit: 1 request per day.
            </div>

            <button onclick="submitWithdrawalRequest()" id="btnSubmitWd" class="btn-withdraw">
                Confirm Bank Withdrawal
            </button>
        </div>
                <!-- Withdrawal History Section -->
        <div class="history-card">
            <h3 style="font-size: 15px; font-weight: 900; color: #0f172a; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;">
                <span>Withdrawal History</span>
                <i class="fa-solid fa-clock-rotate-left" style="color: #16a34a;"></i>
            </h3>
            <div id="wdHistoryList">
                <p style="font-size: 12px; color: #94a3b8; font-weight: 700; text-align: center; padding: 10px;">Loading history...</p>
            </div>
        </div>
    </div>

    <script>
        const activeUser = requireAuth();
        let userCurrentBalance = 0;

        document.addEventListener("DOMContentLoaded", async () => {
            await loadUserProfileAndBank();
            await loadWithdrawalHistory();
        });

        async function loadUserProfileAndBank() {
            if (!activeUser) return;
            const sb = getSupabase();
            if (!sb) return;

            try {
                const { data: profile, error } = await sb
                    .from('profiles')
                    .select('*')
                    .eq('id', activeUser.id)
                    .single();

                if (error) throw error;

                userCurrentBalance = parseFloat(profile.balance || 0);
                document.getElementById('displayBal').innerText = "₹" + userCurrentBalance.toFixed(2);

                // Auto-fill saved bank details if available
                if (profile.holder_name) document.getElementById('holderName').value = profile.holder_name;
                if (profile.account_number) {
                    const accInput = document.getElementById('accNumber');
                    accInput.value = profile.account_number;
                    accInput.disabled = true; // Lock bank account after first save
                }
                if (profile.ifsc_code) document.getElementById('ifscCode').value = profile.ifsc_code;

            } catch (err) {
                console.error(err);
            }
        }

        function calculateNetPayout() {
            const amt = parseFloat(document.getElementById('wdAmount').value) || 0;
            const fee = Math.round(amt * 0.10 * 100) / 100;
            const net = Math.max(0, amt - fee);

            document.getElementById('feeDisplay').innerText = `- ₹${fee.toFixed(2)}`;
            document.getElementById('netPayoutDisplay').innerText = `₹${net.toFixed(2)}`;
        }

async function submitWithdrawalRequest() {
    const amt = parseFloat(document.getElementById('wdAmount').value);
    const name = document.getElementById('holderName').value.trim();
    const acc = document.getElementById('accNumber').value.trim();
    const ifsc = document.getElementById('ifscCode').value.trim().toUpperCase();
    const btn = document.getElementById('btnSubmitWd');

    if (isNaN(amt) || amt < 150) return alert("Minimum withdrawal amount ₹150 hai!");
    if (amt > userCurrentBalance) return alert(`Balance kam hai! Aapka withdrawable balance ₹${userCurrentBalance.toFixed(2)} hai.`);
    if (!name || name.length < 3) return alert("Kripya sahi Account Holder Name dalein!");
    if (!acc || acc.length < 8) return alert("Kripya sahi Bank Account Number dalein!");
    if (!ifsc || ifsc.length < 6) return alert("Kripya sahi IFSC Code dalein!");

    const sb = getSupabase();
    if (!sb) return alert("Database connection error.");

    btn.disabled = true;
    btn.innerText = "Checking Rules & Plan...";

    try {
        // 1. Strict Check: Aaj ka withdrawal ho chuka hai ya nahi (1 Request Per Day Limit)
        const todayStart = new Date();
        todayStart.setHours(0, 0, 0, 0);

        const { data: todayWithdrawals, error: wdCheckErr } = await sb
            .from('withdrawals')
            .select('id, created_at')
            .eq('user_id', activeUser.id)
            .gte('created_at', todayStart.toISOString());

        if (wdCheckErr) throw wdCheckErr;

        if (todayWithdrawals && todayWithdrawals.length > 0) {
            alert("⚠️ Daily Withdrawal Limit Reached!\n\nAap aaj ka 1 withdrawal request pehle hi laga chuke hain. Kripya agla withdrawal kal (Next Day) try karein.");
            btn.disabled = false;
            btn.innerText = "Confirm Bank Withdrawal";
            return;
        }

        // 2. Strict Check: Active Crop Plan Verification
        const { data: activePlans, error: planErr } = await sb
            .from('orders')
            .select('id')
            .eq('user_id', activeUser.id)
            .eq('status', 'active');

        if (planErr) throw planErr;

        if (!activePlans || activePlans.length === 0) {
            alert("⚠️ Withdrawal Blocked!\n\nWithdrawal lene ke liye pehle account me koi bhi ek Crop Plan recharge karke activate karna zaroori hai.");
            window.location.href = 'index.html';
            return;
        }

        btn.innerText = "Processing Request...";

        const feeAmt = Math.round(amt * 0.10 * 100) / 100;
        const finalAmt = amt - feeAmt;
        const remainingBal = userCurrentBalance - amt;

        // 3. Deduct balance from user profile & save bank details
        const { error: pErr } = await sb.from('profiles').update({
            balance: remainingBal,
            holder_name: name,
            account_number: acc,
            ifsc_code: ifsc
        }).eq('id', activeUser.id);

        if (pErr) throw pErr;

        // 4. Insert into withdrawals table
        const { error: wErr } = await sb.from('withdrawals').insert([{
            user_id: activeUser.id,
            phone: activeUser.phone,
            amount: amt,
            fee_amount: feeAmt,
            final_amount: finalAmt,
            holder_name: name,
            account_number: acc,
            ifsc_code: ifsc,
            status: 'pending'
        }]);

        if (wErr) throw wErr;

        // 5. Log transaction
        await sb.from('transactions').insert([{
            user_id: activeUser.id,
            type: 'withdrawal',
            amount: amt,
            details: `Withdrawal to A/C ending with ${acc.slice(-4)}`
        }]);

        alert(`✅ ₹${amt} ka withdrawal request submit ho gaya!\nNet Payout: ₹${finalAmt.toFixed(2)} aapke bank account me bhej diya jayega.`);
        
        document.getElementById('wdAmount').value = '';
        calculateNetPayout();
        await loadUserProfileAndBank();
        await loadWithdrawalHistory();

    } catch (err) {
        alert("Withdrawal Error: " + err.message);
    } finally {
        btn.disabled = false;
        btn.innerText = "Confirm Bank Withdrawal";
    }
}

        async function loadWithdrawalHistory() {
            const box = document.getElementById('wdHistoryList');
            const sb = getSupabase();
            if (!sb) return;

            try {
                const { data: list, error } = await sb
                    .from('withdrawals')
                    .select('*')
                    .eq('user_id', activeUser.id)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!list || list.length === 0) {
                    box.innerHTML = `<p style="font-size: 12px; color: #94a3b8; font-weight: 700; text-align: center; padding: 10px;">Koi withdrawal record nahi hai.</p>`;
                    return;
                }

                box.innerHTML = list.map(item => {
                    let badgeClass = 'badge-pending';
                    if (item.status === 'approved') badgeClass = 'badge-approved';
                    if (item.status === 'rejected') badgeClass = 'badge-rejected';

                    const dateStr = item.created_at ? new Date(item.created_at).toLocaleDateString('en-IN') : 'Recent';

                    return `
                        <div class="history-item">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                                <strong style="font-size: 14px; color: #0f172a;">Req: ₹${parseFloat(item.amount).toFixed(2)}</strong>
                                <span class="badge-status ${badgeClass}">${item.status}</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 11px; color: #64748b; font-weight: 600;">
                                <span>Net: ₹${parseFloat(item.final_amount || item.amount).toFixed(2)} (A/C: ${item.account_number ? item.account_number.slice(-4) : '****'})</span>
                                <span>${dateStr}</span>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                box.innerHTML = `<p style="font-size: 12px; color: #ef4444; font-weight: 700; text-align: center; padding: 10px;">${err.message}</p>`;
            }
        }
    </script>
</body>
    </html>
